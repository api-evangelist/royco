name: Royco
description: >-
  Royco is a decentralized finance (DeFi) protocol offering transparent, structured yield
  markets for capital allocators. Through Royco Dawn, users allocate capital into tranched
  yield markets - senior tranches prioritize base yield with first-loss protection, junior
  tranches accept first loss for amplified yield - or delegate allocation to independent
  curators via vaults, with Loop leverage and a coming secondary market and fixed-rate
  structures. All deposits flow through the RoycoEntryPoint gateway, deployed on Ethereum
  and Avalanche, with critical upgrades gated by 3-of-5 council approval and timelocks.
  The protocol has undergone 5 independent audits and formal verifications (Hexens, Cantina,
  Certora, Nethermind, Immunefi) and ships an official TypeScript SDK plus subgraphs for
  building frontends on top of it.
